services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: medscribe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random local PostgreSQL password}
      POSTGRES_DB: medscribe
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U medscribe]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [private]
  api:
    build: .
    ports: ['127.0.0.1:8000:8000']
    environment: &runtime
      MED_TRANSCRIPT_DB: postgresql://medscribe:${POSTGRES_PASSWORD}@db:5432/medscribe
      MED_TRANSCRIPT_ASSETS: /app/data/assets
    volumes: [./data:/app/data]
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    build: .
    command: [python, -m, services.worker_loop]
    environment: *runtime
    volumes: [./data:/app/data]
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  private:
    internal: true
volumes:
  postgres-data:
