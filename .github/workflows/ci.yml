name: API foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        extras: ['dev', 'dev,asr']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -c constraints-ci.txt -e '.[${{ matrix.extras }}]'
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/clinician-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/clinician-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: med_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: med_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U med_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -c constraints-ci.txt -e '.[dev,postgres]'
      - run: python -m pytest -q tests/test_postgres.py
        env:
          MED_TRANSCRIPT_TEST_POSTGRES: postgresql://med_test:synthetic-ci-password@localhost:5432/med_test
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
      - run: docker build -t med-transcript-ci .
