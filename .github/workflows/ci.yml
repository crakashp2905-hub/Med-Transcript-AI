name: API foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: ['dev', 'dev,asr']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[${{ matrix.extras }}]'
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clinician-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/clinician-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: med_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: med_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U med_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,postgres]'
      - run: python -m pytest -q tests/test_postgres.py
        env:
          MED_TRANSCRIPT_TEST_POSTGRES: postgresql://med_test:synthetic-ci-password@localhost:5432/med_test
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
      - run: docker build -t med-transcript-ci .
