name: API foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        extras: ['dev,security', 'dev,asr,security']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -c constraints-ci.txt -e '.[${{ matrix.extras }}]'
      - name: Python format, lint and type checks
        run: |
          python -m pip install ruff==0.14.4 mypy==1.18.2
          python -m ruff format --check services tests
          python -m ruff check services tests
          python -m mypy services --ignore-missing-imports
      - run: python -m pytest -q
      - name: Enforced offline model-free safety lane
        run: python -m pytest -q tests/test_offline_engineering.py tests/test_domain_integrity.py tests/test_audit_integrity.py tests/test_router_contracts.py tests/test_safety_properties.py tests/test_error_taxonomy.py tests/test_timestamp_registry.py
        env:
          MED_TRANSCRIPT_OFFLINE: '1'
      - name: Verify portable evidence-backed completion count
        run: python -m services.engineering_status
        env:
          MED_TRANSCRIPT_OFFLINE: '1'
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/clinician-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/clinician-web/package-lock.json
      - run: npm ci
      - name: TypeScript type check
        run: npm run build -- --emptyOutDir=false
      - run: npm run build
      - run: npm audit --omit=dev
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: med_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: med_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U med_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -c constraints-ci.txt -e '.[dev,postgres]'
      - run: python -m pytest -q tests/test_postgres.py
        env:
          MED_TRANSCRIPT_TEST_POSTGRES: postgresql://med_test:synthetic-ci-password@localhost:5432/med_test
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
      - run: docker build -t med-transcript-ci .
      - name: Validate hosted Google sign-in configuration
        run: |
          python -c "from pathlib import Path; Path('/tmp/med-google-secret').write_text('synthetic-ci-secret')"
          docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml config --quiet
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          GOOGLE_CLIENT_ID: synthetic-ci-client
          GOOGLE_CLIENT_SECRET_FILE: /tmp/med-google-secret
          GOOGLE_WORKSPACE_DOMAIN: example.org
          MED_TRANSCRIPT_PUBLIC_ORIGIN: https://scribe.example.org
          MED_TRANSCRIPT_MEMBERS_FILE: ./config/members.example.json
