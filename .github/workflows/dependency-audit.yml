name: Dependency audit
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip==26.2.2
      - run: python -m pip install -c constraints-ci.txt -e ".[dev,asr,postgres,media]"
      - run: python -m pip install pip-audit==2.9.0
      - run: python -m pip_audit --strict
